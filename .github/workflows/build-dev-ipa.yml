name: Build Dev IPA

on:
  push:
    branches: [working]
  workflow_dispatch:

concurrency:
  group: build-dev-ipa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Matched on the repository NAME, and the history of this line is the reason.
    #
    # Upstream matches endsWith '/ish-AOK' so that forks still build their own
    # dev IPAs. That skipped every run here, because this fork is called
    # `ish-AOK-bind`. So it was pinned to the full owner/name instead, on the
    # reasoning that this "no longer depends on what this fork happens to be
    # called" -- which was half right. It did not depend on the repo's name any
    # more; it depended on the OWNER's. The account was renamed
    # DogeKingC -> Trlydev, github.repository became
    # `Trlydev/ish-AOK-bind`, and this condition quietly stopped matching.
    #
    # The cost was five weeks of nothing. A guard that does not match does not
    # fail -- the job reports `skipped`, the run is green, and no issue is
    # filed, so the daily sync silently stopped landing and the fork drifted
    # 1225 commits behind upstream before anyone looked. The dev IPA build and
    # the release build stopped at the same moment for the same reason.
    #
    # The name is the part that is actually stable: an owner can be renamed
    # without touching the repository, and the misplaced-tree case this guard
    # exists to prevent involves a repo with a DIFFERENT name, which this still
    # refuses. If the repository itself is ever renamed, update this line --
    # and know that the symptom will again be silence, not a failure.
    if: endsWith(github.repository, '/ish-AOK-bind')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # `submodules: true` stops one level down, and two of smallclue's own
      # submodules ship in the app: third-party/openssh (ssh, scp, sftp,
      # ssh-keygen) and third-party/nextvi (vi). Without them meson swaps in
      # stubs and says so only as a setup WARNING, so every IPA built here had
      # an ssh that says "not built into this iSH-AOK" and a stub vi. Just
      # those two: meson uses none of smallclue's other submodules (dvtm,
      # libgit2, openrsync).
      - name: Check out smallclue's openssh, nextvi and libgit2
        run: git -C deps/smallclue submodule update --init third-party/openssh third-party/nextvi third-party/libgit2

      - name: Select newest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew install llvm lld ninja libarchive
          pip3 install --break-system-packages meson
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      # helix is compiled in (AOK_NATIVE_HELIX=YES in app/iSH.xcconfig) and helix
      # is Rust, so the build needs a Rust toolchain that can emit iOS objects.
      # The runners ship cargo but not the iOS target, and meson's native_rust
      # is `auto`: it sees cargo, enables the Rust program, and only then fails
      # on the missing target. Detecting cargo is not the same as being able to
      # build for iOS, so install the target rather than relying on auto.
      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios
      - name: Build hterm_all.js
        run: |
          cd deps/libapps/hterm
          python3 bin/mkdist
      # deps/dash needs its config.h, which the fork does not commit (the
      # generated sources are committed; see tools/configure-dash.sh). Configure
      # ONLY: `make` fails from a clean checkout and can regenerate nodes.c
      # without the __thread conversion.
      - name: Configure deps/dash
        run: cd deps/dash && ../../tools/configure-dash.sh --quiet

      - name: Build unsigned .app
        run: |
          # ISH_ARM64_GRET picks the arm64-guest gadget dispatch sequence
          # (jit/guest-arm64/gadgets.h). Upstream defaults it to dmb, which is
          # correct for the ARMv8.0 iPad the engine is benchmarked on -- 1.73x
          # there. It is the wrong side of the trade for the phones this fork
          # is built for: on modern Apple cores ldar wins by ~6%, because they
          # retire it nearly free while the dmb barrier still costs.
          #
          # Passed as an xcodebuild build setting, NOT a scheme environment
          # variable: a scheme variable never reaches the build script phase
          # that runs xcode-meson.sh (upstream 49750e57). Confirm which one a
          # build actually got with `uname -v`, which appends " gret=dmb" when
          # dmb is compiled in and nothing for ldar.
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -scheme iSH-AOK \
            -configuration Release \
            -arch arm64 -sdk iphoneos \
            -derivedDataPath build \
            ISH_ARM64_GRET=ldar \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # An unsigned bundle carries no entitlements, and the AltStore family
      # decides what to ask Apple for by reading the entitlements of the app it
      # re-signs -- so it signed AOK with no App Group and the app booted with
      # nowhere to store a filesystem. See tools/adhoc-sign-app.sh.
      - name: Embed entitlements (ad-hoc signature)
        run: ./tools/adhoc-sign-app.sh build/Build/Products/Release-iphoneos/iSH-AOK.app

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/iSH-AOK.app"
          test -d "$APP_PATH"
          SHORT_SHA=$(git rev-parse --short HEAD)
          IPA_NAME="iSH-AOK-dev-${SHORT_SHA}.ipa"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -qr "$IPA_NAME" Payload
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA_NAME="${{ steps.package.outputs.ipa_name }}"
          SHORT_SHA="${{ steps.package.outputs.short_sha }}"
          BODY="Unsigned development build from commit ${SHORT_SHA} (auto-published from \`working\`). Re-sign with AltStore, SideStore, or Sideloadly before installing. This release is overwritten on every push."
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release delete dev-latest --yes --cleanup-tag
          fi
          gh release create dev-latest "$IPA_NAME" \
            --title "Development Build (${SHORT_SHA})" \
            --notes "$BODY" \
            --prerelease \
            --target "${{ github.sha }}"
